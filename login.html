<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact Rating — Connexion</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="auth-layout">

        <!-- Panneau gauche décoratif -->
        <div class="auth-side">
            <a href="index.html" class="side-logo">
                <span>⚽</span> Impact Rating
            </a>
            <div class="side-content">
                <blockquote>"Le terrain ne ment jamais."</blockquote>
                <div class="side-stats">
                    <div class="side-stat">
                        <span class="ss-num">500+</span>
                        <span class="ss-label">Matchs joués</span>
                    </div>
                    <div class="side-stat">
                        <span class="ss-num">50+</span>
                        <span class="ss-label">Joueurs actifs</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panneau droit — formulaire -->
        <div class="auth-main">
            <div class="auth-card">

                <!-- Tabs connexion / inscription -->
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tab-login">Se connecter</button>
                    <button class="auth-tab" id="tab-register">S'inscrire</button>
                </div>

                <!-- Message d'erreur global -->
                <div id="auth-error" class="auth-error hidden"></div>

                <!-- BOUTON GOOGLE -->
                <button id="btn-google" class="btn-google">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continuer avec Google
                </button>

                <div class="auth-divider"><span>ou</span></div>

                <!-- FORMULAIRE EMAIL/MDP -->
                <form id="auth-form">
                    <!-- Champ nom (inscription uniquement) -->
                    <div class="form-group register-only hidden">
                        <label for="input-name">Prénom</label>
                        <input type="text" id="input-name" placeholder="Ton prénom" autocomplete="given-name">
                    </div>

                    <div class="form-group">
                        <label for="input-email">Email</label>
                        <input type="email" id="input-email" placeholder="ton@email.com" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="input-password">Mot de passe</label>
                        <div class="input-password-wrap">
                            <input type="password" id="input-password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
                            <button type="button" id="toggle-password" class="toggle-pw">👁</button>
                        </div>
                    </div>

                    <div class="form-group register-only hidden">
                        <label for="input-confirm">Confirmer le mot de passe</label>
                        <input type="password" id="input-confirm" placeholder="••••••••" autocomplete="new-password">
                    </div>

                    <button type="submit" id="btn-submit" class="btn-submit">
                        <span id="btn-text">Se connecter</span>
                        <span id="btn-loader" class="btn-loader hidden"></span>
                    </button>
                </form>

                <p class="auth-footer-text">
                    En continuant, tu acceptes les règles du groupe. ⚽
                </p>

            </div>
        </div>
    </div>

    <script type="module">
        import { connecterAvecGoogle, connecterAvecEmail, inscrireAvecEmail, requireGuest, isSuperAdmin } from './js/auth.js';

        // Redirige si déjà connecté
        requireGuest();

        // ========== ONGLETS ==========
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const registerOnlyFields = document.querySelectorAll('.register-only');
        const btnText = document.getElementById('btn-text');
        const passwordInput = document.getElementById('input-password');

        let modeActuel = 'login';

        function activerOnglet(mode) {
            modeActuel = mode;
            tabLogin.classList.toggle('active', mode === 'login');
            tabRegister.classList.toggle('active', mode === 'register');
            registerOnlyFields.forEach(el => el.classList.toggle('hidden', mode === 'login'));
            btnText.textContent = mode === 'login' ? 'Se connecter' : "Créer mon compte";
            passwordInput.setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
            clearError();
        }

        tabLogin.addEventListener('click', () => activerOnglet('login'));
        tabRegister.addEventListener('click', () => activerOnglet('register'));

        // Détecter mode depuis URL (?mode=register) — après init des vars DOM
        const params = new URLSearchParams(window.location.search);
        if (params.get('mode') === 'register') activerOnglet('register');

        // ========== AFFICHER/MASQUER MDP ==========
        document.getElementById('toggle-password').addEventListener('click', () => {
            const input = document.getElementById('input-password');
            input.type = input.type === 'password' ? 'text' : 'password';
        });

        // ========== ERREURS ==========
        function showError(msg) {
            const el = document.getElementById('auth-error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        function clearError() {
            document.getElementById('auth-error').classList.add('hidden');
        }

        function setLoading(loading) {
            const btn = document.getElementById('btn-submit');
            const text = document.getElementById('btn-text');
            const loader = document.getElementById('btn-loader');
            btn.disabled = loading;
            text.classList.toggle('hidden', loading);
            loader.classList.toggle('hidden', !loading);
        }

        async function handleAuthSuccess(user) {
            if (await isSuperAdmin(user.uid)) {
                window.location.href = 'super-admin.html';
            } else {
                window.location.href = 'profil.html';
            }
        }

        function parseFirebaseError(code) {
            const messages = {
                'auth/user-not-found': 'Aucun compte avec cet email.',
                'auth/wrong-password': 'Mot de passe incorrect.',
                'auth/invalid-credential': 'Email ou mot de passe incorrect.',
                'auth/email-already-in-use': 'Un compte existe déjà avec cet email.',
                'auth/weak-password': 'Le mot de passe doit contenir au moins 6 caractères.',
                'auth/invalid-email': 'Adresse email invalide.',
                'auth/popup-closed-by-user': 'Connexion annulée.',
                'auth/network-request-failed': 'Erreur réseau. Vérifie ta connexion.',
            };
            return messages[code] || 'Une erreur est survenue. Réessaye.';
        }

        // ========== GOOGLE ==========
        document.getElementById('btn-google').addEventListener('click', async () => {
            clearError();
            setLoading(true);
            try {
                const user = await connecterAvecGoogle();
                handleAuthSuccess(user);
            } catch (err) {
                console.error('Erreur Google Auth:', err);
                const msg = err.code ? parseFirebaseError(err.code) : (err.message || 'Erreur inconnue. Vérifie la console (F12).');
                showError(msg);
                setLoading(false);
            }
        });

        // ========== FORMULAIRE ==========
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();

            const email = document.getElementById('input-email').value.trim();
            const password = document.getElementById('input-password').value;

            if (!email || !password) return;

            setLoading(true);

            try {
                if (modeActuel === 'login') {
                    const user = await connecterAvecEmail(email, password);
                    handleAuthSuccess(user);
                } else {
                    const name = document.getElementById('input-name').value.trim();
                    const confirm = document.getElementById('input-confirm').value;

                    if (!name) { showError('Entre ton prénom.'); setLoading(false); return; }
                    if (password !== confirm) { showError('Les mots de passe ne correspondent pas.'); setLoading(false); return; }

                    const user = await inscrireAvecEmail(email, password, name);
                    handleAuthSuccess(user);
                }
            } catch (err) {
                showError(parseFirebaseError(err.code));
                setLoading(false);
            }
        });
    </script>
</body>
</html>
